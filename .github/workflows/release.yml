name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag from checked master history'
        type: string
        required: true
        default: v0.0.1
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: payments-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      source_ref: ${{ github.sha }}
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release identity
        id: identity
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release.py check --tag "$REQUESTED_TAG"
          git merge-base --is-ancestor HEAD origin/master
          if git show-ref --verify --quiet "refs/tags/$REQUESTED_TAG"; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")"
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - name: Fetch pinned host packager
        uses: actions/checkout@v4
        with:
          repository: zerodenet/zboard
          ref: 505d0b728ea6d3fd78730326718b2446bdef9a7b
          path: .local/host
          persist-credentials: false
      - name: Prepare protected signing key
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
          PLUGIN_PUBLISHER_ID: ${{ vars.PLUGIN_PUBLISHER_ID }}
          PLUGIN_PUBLIC_KEY: ${{ vars.PLUGIN_PUBLIC_KEY }}
        run: python3 scripts/release.py key --out "$RUNNER_TEMP/payments-signing.key"
      - name: Build and verify signed packages
        env:
          ZBOARD_DIR: ${{ github.workspace }}/.local/host
          PLUGIN_PUBLISHER_ID: ${{ vars.PLUGIN_PUBLISHER_ID }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            scripts/build-package.sh "$PWD/dist/zboard-payments-$RELEASE_TAG-$platform.zbplugin" "$RUNNER_TEMP/payments-signing.key" "$PLUGIN_PUBLISHER_ID" "$platform"
          done
      - name: Generate release metadata
        env:
          PLUGIN_PUBLISHER_ID: ${{ vars.PLUGIN_PUBLISHER_ID }}
          PLUGIN_PUBLIC_KEY: ${{ vars.PLUGIN_PUBLIC_KEY }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: python3 scripts/release.py metadata --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"
      - name: Generate marketplace release manifest
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: python3 scripts/marketplace.py --tag "$RELEASE_TAG" --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$(git rev-parse HEAD)" --draft --title "$RELEASE_TAG" --notes-file dist/release-notes.md
          gh release upload "$RELEASE_TAG" dist/zboard-payments-v*.zbplugin dist/SHA256SUMS dist/release-metadata.json dist/publisher.pub dist/marketplace-entry.json
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/payments-signing.key"
